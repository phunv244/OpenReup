name: CI

on:
  push:
    branches: [main, claude]
  pull_request:

jobs:
  api:
    name: API tests (node:test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:api

  web:
    name: Web build (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm run build:web

  python:
    name: Pipeline tests (pipeline/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install numpy scikit-learn
      # VieNeu-TTS (kèm model) quá nặng cho CI: 2 test này chạy bằng `npm test` trên máy có .venv.
      - run: python pipeline/tests/test_dub_video.py
        env:
          SKIP_TESTS: test_vieneu_voice_parsing,test_gpu_batched_tts_dedup_and_unload
