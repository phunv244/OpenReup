<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenReup Studio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%235b5bd6'/><path d='M12 9.5v13l11-6.5z' fill='white'/></svg>" />
  <script>
    // Áp theme trước khi vẽ trang để không bị nháy sáng/tối.
    document.documentElement.dataset.theme =
      localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  </script>
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/projects">
        <span class="brand-logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></span>
        <span>
          <span class="brand-name">OpenReup Studio</span>
          <span class="brand-sub">Tải · Dịch · Lồng tiếng AI</span>
        </span>
      </a>

      <nav class="nav" id="sidebar-nav" aria-label="Điều hướng chính"></nav>

      <div class="sb-foot">
        <div class="js-task" data-variant="sidebar"></div>
        <div class="sb-tools">
          <a class="sb-tool" href="#/help" id="sb-help"></a>
          <button class="sb-tool" id="theme-toggle" type="button" title="Đổi giao diện sáng / tối"></button>
        </div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Mở menu"></button>
        <div class="topbar-title">
          <h1 id="page-title">Dự án</h1>
          <p id="page-sub"></p>
        </div>
        <a class="task-chip" id="task-chip" hidden></a>
        <div class="topbar-actions" id="topbar-actions"></div>
      </header>

      <main id="content" class="content"></main>
    </div>
  </div>

  <div class="sb-backdrop" id="sb-backdrop"></div>
  <div id="drawer-root"></div>
  <div id="modal-root"></div>
  <div id="toasts" role="status" aria-live="polite"></div>

  <script src="/assets/app.js"></script>
</body>
</html>
